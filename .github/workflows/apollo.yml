name: Apollo lead gen
on:
  schedule:
    - cron: "45 1 * * 1-5"    # 01:45 UTC = 7:15 AM IST, Mon–Fri
  workflow_dispatch:
jobs:
  apollo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SB_URL: ${{ secrets.SB_URL }}
      SB_ANON: ${{ secrets.SB_ANON }}
      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Corporates (Mumbai, 100+ employees)
        timeout-minutes: 4
        run: python3 leadgen.py apollo-corporates 8
      - name: Hospitality groups (Mumbai)
        if: success() || failure()
        timeout-minutes: 4
        run: python3 leadgen.py apollo-hospitality 8
      - name: Agencies abroad (Mon/Thu uk, Tue uae, Wed au, Fri us)
        if: success() || failure()
        timeout-minutes: 4
        run: |
          case "$(TZ=Asia/Kolkata date +%u)" in
            2) R=uae ;;
            3) R=au ;;
            5) R=us ;;
            *) R=uk ;;
          esac
          echo "Region: $R"
          python3 leadgen.py apollo-agencies "$R" 12
